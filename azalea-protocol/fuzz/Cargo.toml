[package]
name = "azalea-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[lib]
name = "azalea_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
azalea-protocol = { path = ".." }
azalea-block = { path = "../../azalea-block" }
azalea-buf = { path = "../../azalea-buf" }
azalea-chat = { path = "../../azalea-chat", features = ["azalea-buf"] }
# test_utils (the networkless Simulation) needs `log`
azalea-client = { path = "../../azalea-client", default-features = false, features = ["log"] }
azalea-core = { path = "../../azalea-core" }
azalea-inventory = { path = "../../azalea-inventory" }
azalea-registry = { path = "../../azalea-registry" }
azalea-world = { path = "../../azalea-world" }
serde_json = "1"
simdnbt = "0.10"

[[bin]]
name = "clientbound_config"
path = "fuzz_targets/clientbound_config.rs"
test = false
doc = false
bench = false
